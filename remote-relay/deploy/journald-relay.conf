# Optional TEMPLATE for a separate journald namespace, not a global drop-in.
# Review support before use: set LogNamespace=cccodroid-relay in the unit and
# install as /etc/systemd/journald@cccodroid-relay.conf. Do not alter current logs.
[Journal]
SystemMaxUse=8M
RuntimeMaxUse=4M
MaxRetentionSec=3day
RateLimitIntervalSec=30s
RateLimitBurst=30
